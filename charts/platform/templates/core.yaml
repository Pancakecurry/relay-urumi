{{- if eq .Values.mode "core" }}
{{- range $role := list "api" "gateway" }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: relay-{{ $role }}}
spec:
  replicas: 1
  selector: {matchLabels: {relay.role: {{ $role }}}}
  template:
    metadata: {labels: {relay.role: {{ $role }}}}
    spec:
      {{- if eq $role "api" }}
      serviceAccountName: relay-secret-manager
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ $role }}
          image: {{ $.Values.platformImage | quote }}
          imagePullPolicy: IfNotPresent
          command: [node, {{ printf "dist/apps/%s/src/server.js" $role | quote }}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: {{ if eq $role "api" }}3001{{ else }}3000{{ end }}}]
          env:
            - {name: RELAY_DATA_TLS, value: {{ $.Values.transportTls.dataEnabled | quote }}}
            - {name: REQUIRE_UPSTREAM_TLS, value: {{ $.Values.transportTls.requireUpstreams | quote }}}
            {{- if $.Values.transportTls.enabled }}
            - {name: RELAY_TLS_DIR, value: /run/tls}
            {{- end }}
            - {name: OAUTH_ENABLED, value: {{ $.Values.oauthEnabled | quote }}}
            - {name: PUBLIC_ORIGIN, value: {{ $.Values.publicOrigin | quote }}}
            - {name: ALLOWED_UPSTREAM_URLS, value: {{ join "," $.Values.allowedUpstreamUrls | quote }}}
            - {name: STORE_DOMAIN, value: {{ $.Values.storeDomain | quote }}}
            - {name: STORE_URL_SUFFIX, value: {{ $.Values.storeUrlSuffix | quote }}}
            - {name: STORE_USER_LIMIT, value: {{ $.Values.storeUserLimit | quote }}}
            - {name: STORE_TIMEOUT_SECONDS, value: {{ $.Values.storeTimeoutSeconds | quote }}}
            - {name: MODEL_ENABLED, value: {{ $.Values.modelEnabled | quote }}}
            - {name: STOREFRONT_URL, value: {{ $.Values.storefrontUrl | quote }}}
          resources: {{ $.Values.platformResources | toJson }}
          readinessProbe: {httpGet: {scheme: {{ if $.Values.transportTls.enabled }}HTTPS{{ else }}HTTP{{ end }}, path: /health/ready, port: http, httpHeaders: [{name: Host, value: localhost}]}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {scheme: {{ if $.Values.transportTls.enabled }}HTTPS{{ else }}HTTP{{ end }}, path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}, initialDelaySeconds: 5, periodSeconds: 10}
          volumeMounts:
            - {name: secrets, mountPath: /run/platform, readOnly: true}
            {{- if $.Values.transportTls.enabled }}
            - {name: tls, mountPath: /run/tls, readOnly: true}
            {{- end }}
            {{- if $.Values.transportTls.dataEnabled }}
            - {name: db-app-tls, mountPath: /run/db-tls/app, readOnly: true}
            {{- if eq $role "api" }}
            - {name: db-auth-tls, mountPath: /run/db-tls/auth, readOnly: true}
            {{- end }}
            {{- end }}
            {{- if and (eq $role "api") $.Values.modelEnabled }}
            - {name: model, mountPath: /run/model, readOnly: true}
            {{- end }}
      volumes:
        {{- if $.Values.transportTls.enabled }}
        - {name: tls, secret: {secretName: relay-{{ $role }}-tls, defaultMode: 0440}}
        {{- end }}
        {{- if $.Values.transportTls.dataEnabled }}
        - {name: db-app-tls, secret: {secretName: relay-db-app-tls, defaultMode: 0440}}
        {{- if eq $role "api" }}
        - {name: db-auth-tls, secret: {secretName: relay-db-auth-tls, defaultMode: 0440}}
        {{- end }}
        {{- end }}
        - {name: secrets, secret: {secretName: {{ printf "platform-%s" $role }}, defaultMode: 0440}}
        {{- if and (eq $role "api") $.Values.modelEnabled }}
        - {name: model, secret: {secretName: {{ $.Values.modelSecretName }}, defaultMode: 0440}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: relay-{{ $role }}
  {{- if $.Values.transportTls.enabled }}
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: {{ printf "%s-relay-%s@kubernetescrd" $.Release.Namespace $role | quote }}
  {{- end }}
spec:
  selector: {relay.role: {{ $role }}}
  ports: [{port: {{ if eq $role "api" }}3001{{ else }}3000{{ end }}, targetPort: http}]
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: relay-secret-manager}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: relay-secret-manager}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [gateway-upstream-credentials]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: relay-secret-manager}
subjects: [{kind: ServiceAccount, name: relay-secret-manager, namespace: {{ .Release.Namespace }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: relay-secret-manager}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: relay-postgres}
spec:
  serviceName: relay-postgres
  replicas: 1
  selector: {matchLabels: {relay.role: postgres}}
  template:
    metadata: {labels: {relay.role: postgres}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: {{ .Values.pgImage | quote }}
          args:
            - -c
            - shared_buffers=32MB
            - -c
            - max_connections=40
            - -c
            - log_statement=none
            - -c
            - log_min_error_statement=panic
            - -c
            - log_parameter_max_length_on_error=0
            {{- if .Values.transportTls.dataEnabled }}
            - -c
            - ssl=on
            - -c
            - ssl_min_protocol_version=TLSv1.3
            - -c
            - ssl_cert_file=/run/tls/tls.crt
            - -c
            - ssl_key_file=/run/tls/tls.key
            - -c
            - ssl_ca_file=/run/tls/ca.crt
            - -c
            - hba_file=/run/tls-auth/pg_hba.conf
            {{- end }}
          env:
            - {name: POSTGRES_DB, value: relay}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-db-admin, key: pg-postgres}}
          ports: [{name: pg, containerPort: 5432}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          readinessProbe: {exec: {command: [pg_isready, -U, postgres, -d, relay]}, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -U, postgres, -d, relay]}, initialDelaySeconds: 15, periodSeconds: 10}
          volumeMounts:
            {{- if .Values.transportTls.dataEnabled }}
            - {name: tls, mountPath: /run/tls, readOnly: true}
            - {name: tls-auth, mountPath: /run/tls-auth, readOnly: true}
            {{- end }}
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: socket, mountPath: /var/run/postgresql}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: socket, emptyDir: {sizeLimit: 16Mi}}
        {{- if .Values.transportTls.dataEnabled }}
        - {name: tls, secret: {secretName: relay-postgres-tls, defaultMode: 0440}}
        - {name: tls-auth, configMap: {name: relay-postgres-tls-auth, defaultMode: 0440}}
        {{- end }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: {{ .Values.storageClass | quote }}, resources: {requests: {storage: {{ .Values.pgStorage }}}}}
---
apiVersion: v1
kind: Service
metadata: {name: relay-postgres}
spec: {selector: {relay.role: postgres}, ports: [{port: 5432, targetPort: pg}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: relay-redis}
spec:
  serviceName: relay-redis
  replicas: 1
  selector: {matchLabels: {relay.role: redis}}
  template:
    metadata: {labels: {relay.role: redis}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: {{ .Values.redisImage | quote }}
          command: [redis-server, /run/redis/redis.conf]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: redis, containerPort: 6379}]
          resources: {requests: {cpu: 20m, memory: 24Mi}, limits: {cpu: 250m, memory: 96Mi}}
          readinessProbe:
            exec: {command: [sh, -c, 'REDISCLI_AUTH="$(cat /run/redis/password)" redis-cli {{ if .Values.transportTls.dataEnabled }}--tls --sni relay-redis --cacert /run/tls/ca.crt --cert /run/tls/tls.crt --key /run/tls/tls.key {{ end }}ping | grep -q PONG']}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, 'REDISCLI_AUTH="$(cat /run/redis/password)" redis-cli {{ if .Values.transportTls.dataEnabled }}--tls --sni relay-redis --cacert /run/tls/ca.crt --cert /run/tls/tls.crt --key /run/tls/tls.key {{ end }}ping | grep -q PONG']}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /run/redis, readOnly: true}
            {{- if .Values.transportTls.dataEnabled }}
            - {name: tls, mountPath: /run/tls, readOnly: true}
            {{- end }}
      volumes:
        - {name: config, secret: {secretName: {{ if .Values.transportTls.dataEnabled }}platform-redis-tls-config{{ else }}platform-redis-config{{ end }}, defaultMode: 0440}}
        {{- if .Values.transportTls.dataEnabled }}
        - {name: tls, secret: {secretName: relay-redis-tls, defaultMode: 0440}}
        {{- end }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: {{ .Values.storageClass | quote }}, resources: {requests: {storage: {{ .Values.redisStorage }}}}}
---
apiVersion: v1
kind: Service
metadata: {name: relay-redis}
spec: {selector: {relay.role: redis}, ports: [{port: 6379, targetPort: redis}]}
---
apiVersion: batch/v1
kind: Job
metadata: {name: relay-migrate-{{ .Release.Revision }}}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 240
  template:
    metadata: {labels: {relay.role: migration}}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migration
          image: {{ .Values.platformImage | quote }}
          command: [node, dist/packages/db/src/migrate.js]
          {{- if .Values.transportTls.dataEnabled }}
          env:
            - {name: RELAY_DATA_TLS, value: "true"}
            - {name: RELAY_TLS_DIR, value: /run/tls}
          {{- end }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 192Mi}}
          volumeMounts:
            - {name: secrets, mountPath: /run/platform, readOnly: true}
            {{- if .Values.transportTls.dataEnabled }}
            - {name: tls, mountPath: /run/tls, readOnly: true}
            - {name: db-postgres-tls, mountPath: /run/db-tls/postgres, readOnly: true}
            {{- end }}
      volumes:
        - {name: secrets, secret: {secretName: platform-db-admin, defaultMode: 0440}}
        {{- if .Values.transportTls.dataEnabled }}
        - {name: tls, secret: {secretName: relay-migration-tls, defaultMode: 0440}}
        - {name: db-postgres-tls, secret: {secretName: relay-db-postgres-tls, defaultMode: 0440}}
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: relay-core}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.platformTlsSecret }}
  tls:
    - hosts: [{{ .Values.platformHost | quote }}]
      secretName: {{ .Values.platformTlsSecret | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.platformHost | quote }}
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend: {service: {name: relay-gateway, port: {number: 3000}}}
          - path: /.well-known
            pathType: Prefix
            backend: {service: {name: relay-api, port: {number: 3001}}}
          - path: /api
            pathType: Prefix
            backend: {service: {name: relay-api, port: {number: 3001}}}
    {{- range .Values.additionalMcpHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend: {service: {name: relay-gateway, port: {number: 3000}}}
    {{- end }}
{{- end }}
