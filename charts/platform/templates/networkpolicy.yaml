apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-proof
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: relay-m0-proof}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
        - podSelector:
            matchLabels: {relay-m0-access: allowed}
      ports: [{protocol: TCP, port: 3000}]
  egress: []
