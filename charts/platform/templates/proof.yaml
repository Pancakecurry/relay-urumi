apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-proof
  labels: {app.kubernetes.io/name: relay-m0-proof}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: relay-m0-proof}
  template:
    metadata:
      labels: {app.kubernetes.io/name: relay-m0-proof}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: proof
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 3000}]
          env: [{name: M0_SECRET_FILE, value: /run/relay-secret/token}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ .Values.resources | toJson }}
          readinessProbe:
            httpGet: {path: /health/ready, port: http, httpHeaders: [{name: Host, value: localhost}]}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts: [{name: credential, mountPath: /run/relay-secret, readOnly: true}]
      volumes:
        - name: credential
          secret:
            secretName: {{ .Values.secretName }}
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-proof
spec:
  selector: {app.kubernetes.io/name: relay-m0-proof}
  ports: [{name: http, port: 3000, targetPort: http}]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-proof
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{ if .Values.ingress.host }}host: {{ .Values.ingress.host | quote }}{{ end }}
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-proof
                port: {number: 3000}
{{- end }}
