apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app: "{{ .Release.Name }}-bootstrap", role: bootstrap}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- if .Values.runtime.nonRoot }}
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        {{- end }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: {{ .Values.wordpress.image | quote }}
          imagePullPolicy: {{ .Values.wordpress.pullPolicy }}
          {{- if .Values.runtime.nonRoot }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          {{- end }}
          command: [bash, /opt/relay/bootstrap.sh]
          env:
            {{- include "store.env" . | nindent 12 }}
            - {name: RELAY_SITE_URL, value: {{ .Values.site.url | quote }}}
            - {name: RELAY_SITE_TITLE, value: {{ .Values.site.title | quote }}}
            - {name: RELAY_TIMEZONE, value: {{ .Values.site.timezone | quote }}}
            - {name: RELAY_CURRENCY, value: {{ .Values.site.currency | quote }}}
          resources: {{ toYaml .Values.bootstrap.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.runtime.nonRoot }}
            - {name: tmp, mountPath: /tmp}
            {{- end }}
            {{- if .Values.transportTls.enabled }}
            - {name: wp-tls, mountPath: /run/wp-tls, readOnly: true}
            {{- end }}
            - {name: content, mountPath: /var/www/html}
            - {name: runtime, mountPath: /run/store, readOnly: true}
            - {name: admin, mountPath: /run/admin, readOnly: true}
            - {name: adapter, mountPath: /run/adapter, readOnly: true}
      volumes:
        {{- if .Values.transportTls.enabled }}
        - {name: wp-tls, secret: {secretName: {{ .Release.Name }}-wp-tls, defaultMode: 0440}}
        {{- end }}
        {{- if .Values.runtime.nonRoot }}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        {{- end }}
        - name: content
          persistentVolumeClaim: {claimName: "{{ .Release.Name }}-content"}
        - name: runtime
          secret: {secretName: {{ .Values.secrets.runtime }}, defaultMode: 0440}
        - name: admin
          secret: {secretName: {{ .Values.secrets.admin }}, defaultMode: 0440}
        - name: adapter
          secret: {secretName: {{ .Values.secrets.adapter }}, defaultMode: 0440}
