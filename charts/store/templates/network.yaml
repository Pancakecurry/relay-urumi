apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-isolation
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-database
spec:
  podSelector:
    matchLabels: {role: database}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {role: wordpress}}
        - podSelector: {matchLabels: {role: bootstrap}}
      ports: [{protocol: TCP, port: 3306}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-wordpress
spec:
  podSelector:
    matchLabels: {role: wordpress}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - podSelector: {matchLabels: {role: adapter}}
      ports: [{protocol: TCP, port: {{ if .Values.transportTls.enabled }}8443{{ else if .Values.runtime.nonRoot }}8080{{ else }}80{{ end }}}]
  egress:
    - to: [{podSelector: {matchLabels: {role: database}}}]
      ports: [{protocol: TCP, port: 3306}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-bootstrap
spec:
  podSelector:
    matchLabels: {role: bootstrap}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {role: database}}}]
      ports: [{protocol: TCP, port: 3306}]
