apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-db
spec:
  type: ClusterIP
  selector: {app: "{{ .Release.Name }}-db"}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-db
spec:
  serviceName: {{ .Release.Name }}-db
  replicas: 1
  selector:
    matchLabels: {app: "{{ .Release.Name }}-db"}
  template:
    metadata:
      labels: {app: "{{ .Release.Name }}-db", role: database}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image | quote }}
          args: ["--innodb-buffer-pool-size=128M", "--max-connections=40"]
          env:
            - {name: MARIADB_DATABASE, value: wordpress}
            - {name: MARIADB_USER, value: wordpress}
            - {name: MARIADB_PASSWORD_FILE, value: /run/store/db-password}
            - {name: MARIADB_ROOT_PASSWORD_FILE, value: /run/store/root-password}
          ports: [{name: mysql, containerPort: 3306}]
          startupProbe:
            exec: {command: [healthcheck.sh, --connect, --innodb_initialized]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [healthcheck.sh, --connect, --innodb_initialized]}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [healthcheck.sh, --connect, --innodb_initialized]}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{ toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: runtime, mountPath: /run/store, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: "{{ .Release.Name }}-db"}
        - name: runtime
          secret:
            secretName: {{ .Values.secrets.runtime }}
            items:
              - {key: db-password, path: db-password}
              - {key: root-password, path: root-password}
