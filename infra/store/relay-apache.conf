ServerName localhost
ServerTokens Prod
ServerSignature Off
<IfDefine RELAY_TLS>
  Listen 8443
  <VirtualHost *:8443>
    DocumentRoot /var/www/html
    SSLEngine on
    SSLProtocol -all +TLSv1.3
    SSLCertificateFile /run/wp-tls/tls.crt
    SSLCertificateKeyFile /run/wp-tls/tls.key
    SSLCACertificateFile /run/wp-tls/ca.crt
    SSLOptions +StdEnvVars
    SSLVerifyClient optional
    SSLVerifyDepth 2
    <LocationMatch "^/wp-json/wc/v3(?:/|$)">
      Require expr "%{SSL_CLIENT_VERIFY} == 'SUCCESS' && %{SSL_CLIENT_S_DN_CN} == '${RELAY_ADAPTER_CN}'"
    </LocationMatch>
  </VirtualHost>
</IfDefine>
