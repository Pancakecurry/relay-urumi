apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: relay-m0
servers: 1
agents: 0
kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
  hostPort: "0"
image: rancher/k3s:v1.37.1-k3s1
ports:
  - port: 127.0.0.1:18080:80
    nodeFilters: [loadbalancer]
options:
  k3s:
    extraArgs:
      - arg: --secrets-encryption
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
