---
# Source: relay-store/templates/wordpress.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-store-wp
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: "demo-store-wp"}
  template:
    metadata:
      labels: {app: "demo-store-wp", role: wordpress}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: wordpress
          image: "relay/store:m1-2374b9c0c5f86c48"
          imagePullPolicy: IfNotPresent
          env:
            - name: WORDPRESS_DB_HOST
              value: "demo-store-db:3306"
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD_FILE
              value: /run/store/db-password
            - name: WORDPRESS_AUTH_KEY_FILE
              value: /run/store/AUTH_KEY
            - name: WORDPRESS_SECURE_AUTH_KEY_FILE
              value: /run/store/SECURE_AUTH_KEY
            - name: WORDPRESS_LOGGED_IN_KEY_FILE
              value: /run/store/LOGGED_IN_KEY
            - name: WORDPRESS_NONCE_KEY_FILE
              value: /run/store/NONCE_KEY
            - name: WORDPRESS_AUTH_SALT_FILE
              value: /run/store/AUTH_SALT
            - name: WORDPRESS_SECURE_AUTH_SALT_FILE
              value: /run/store/SECURE_AUTH_SALT
            - name: WORDPRESS_LOGGED_IN_SALT_FILE
              value: /run/store/LOGGED_IN_SALT
            - name: WORDPRESS_NONCE_SALT_FILE
              value: /run/store/NONCE_SALT
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', 'http://store.relay.localhost:18080');
                define('WP_SITEURL', 'http://store.relay.localhost:18080');
                define('DISALLOW_FILE_EDIT', true);
                define('AUTOMATIC_UPDATER_DISABLED', true);
                define('WP_AUTO_UPDATE_CORE', false);
                define('WP_MEMORY_LIMIT', '256M');
                define('WP_MAX_MEMORY_LIMIT', '256M');
          ports: [{name: http, containerPort: 80}]
          startupProbe:
            httpGet: {path: /wp-includes/images/blank.gif, port: http}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /relay-health.php, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /wp-includes/images/blank.gif, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "1"
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 192Mi
          volumeMounts:
            - {name: content, mountPath: /var/www/html}
            - {name: runtime, mountPath: /run/store, readOnly: true}
      volumes:
        - name: content
          persistentVolumeClaim: {claimName: "demo-store-content"}
        - name: runtime
          secret:
            secretName: store-runtime
            items:
              - {key: db-password, path: db-password}
              - {key: AUTH_KEY, path: AUTH_KEY}
              - {key: SECURE_AUTH_KEY, path: SECURE_AUTH_KEY}
              - {key: LOGGED_IN_KEY, path: LOGGED_IN_KEY}
              - {key: NONCE_KEY, path: NONCE_KEY}
              - {key: AUTH_SALT, path: AUTH_SALT}
              - {key: SECURE_AUTH_SALT, path: SECURE_AUTH_SALT}
              - {key: LOGGED_IN_SALT, path: LOGGED_IN_SALT}
              - {key: NONCE_SALT, path: NONCE_SALT}

---
# Source: relay-store/templates/database.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-store-db
spec:
  serviceName: demo-store-db
  replicas: 1
  selector:
    matchLabels: {app: "demo-store-db"}
  template:
    metadata:
      labels: {app: "demo-store-db", role: database}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mariadb
          image: "mariadb:11.8.9-noble@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15"
          args: ["--innodb-buffer-pool-size=128M", "--max-connections=40"]
          env:
            - {name: MARIADB_DATABASE, value: wordpress}
            - {name: MARIADB_USER, value: wordpress}
            - {name: MARIADB_PASSWORD_FILE, value: /run/store/db-password}
            - {name: MARIADB_ROOT_PASSWORD_FILE, value: /run/store/root-password}
          ports: [{name: mysql, containerPort: 3306}]
          startupProbe:
            exec: {command: [healthcheck.sh, --connect, --innodb_initialized]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [healthcheck.sh, --connect, --innodb_initialized]}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [healthcheck.sh, --connect, --innodb_initialized]}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              cpu: 750m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: runtime, mountPath: /run/store, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: "demo-store-db"}
        - name: runtime
          secret:
            secretName: store-runtime
            items:
              - {key: db-password, path: db-password}
              - {key: root-password, path: root-password}

---
# Source: relay-store/templates/wordpress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-store-store
spec:
  ingressClassName: traefik
  rules:
    - host: "store.relay.localhost"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-store-wp
                port: {number: 80}
