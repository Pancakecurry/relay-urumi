apiVersion: batch/v1
kind: Job
metadata: {name: relay-migrate-1}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 240
  template:
    metadata: {labels: {relay.role: migration}}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migration
          image: "relay/platform:m4-b63252eb020badb9"
          command: [node, dist/packages/db/src/migrate.js]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 192Mi}}
          volumeMounts:
            - {name: secrets, mountPath: /run/platform, readOnly: true}
      volumes: [{name: secrets, secret: {secretName: platform-db-admin, defaultMode: 0440}}]

