apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: relay-core}
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["relay.example.invalid"]
      secretName: "example-tls"
  rules:
    - host: "relay.example.invalid"
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend: {service: {name: relay-gateway, port: {number: 3000}}}
          - path: /api
            pathType: Prefix
            backend: {service: {name: relay-api, port: {number: 3001}}}

