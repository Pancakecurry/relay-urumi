# Source: relay-platform/templates/core.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: relay-redis}
spec:
  serviceName: relay-redis
  replicas: 1
  selector: {matchLabels: {relay.role: redis}}
  template:
    metadata: {labels: {relay.role: redis}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: "redis:8.2.10-alpine3.22@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635"
          command: [redis-server, /run/redis/redis.conf]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: redis, containerPort: 6379}]
          resources: {requests: {cpu: 20m, memory: 24Mi}, limits: {cpu: 250m, memory: 96Mi}}
          readinessProbe:
            exec: {command: [sh, -c, 'REDISCLI_AUTH="$(cat /run/redis/password)" redis-cli ping | grep -q PONG']}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, 'REDISCLI_AUTH="$(cat /run/redis/password)" redis-cli ping | grep -q PONG']}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /data}, {name: config, mountPath: /run/redis, readOnly: true}]
      volumes: [{name: config, secret: {secretName: platform-redis-config, defaultMode: 0440}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: "local-path", resources: {requests: {storage: 128Mi}}}

