---
# Source: hosted-mcp/templates/upstream.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-core-private
spec:
  podSelector: {matchLabels: {relay.upstream: relay-core}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: relay-platform}}
          podSelector: {matchLabels: {relay.role: gateway}}
      ports: [{protocol: TCP, port: 3000}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels: {app: "demo-store-wp", role: wordpress}
      ports: [{protocol: TCP, port: 80}]

---
# Source: hosted-mcp/templates/upstream.yaml
apiVersion: v1
kind: Service
metadata:
  name: relay-core
spec:
  type: ClusterIP
  selector: {relay.upstream: relay-core}
  ports: [{name: http, port: 3000, targetPort: http}]

---
# Source: hosted-mcp/templates/upstream.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-core
spec:
  replicas: 1
  selector:
    matchLabels: {relay.upstream: relay-core}
  template:
    metadata:
      labels: {relay.upstream: relay-core, role: adapter}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: "relay/platform:m4-b63252eb020badb9"
          imagePullPolicy: IfNotPresent
          command: [node, "dist/apps/woocommerce-mcp/src/server.js"]
          ports: [{name: http, containerPort: 3000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits:
              cpu: 500m
              memory: 192Mi
            requests:
              cpu: 25m
              memory: 64Mi
          livenessProbe:
            httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http, httpHeaders: [{name: Host, value: localhost}]}
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - {name: MCP_SECRET_FILE, value: /secrets/mcp/token}
            - {name: MCP_SERVICE_HOST, value: relay-core}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: WC_KEY_FILE, value: /secrets/woo/consumer-key}
            - {name: WC_SECRET_FILE, value: /secrets/woo/consumer-secret}
            - {name: STORE_CANONICAL_URL, value: "http://store.example.invalid"}
            - {name: STORE_CONNECTION_URL, value: "http://demo-store-wp"}
            - {name: STORE_CURRENCY, value: "INR"}
            - {name: STORE_TIMEZONE, value: "Asia/Kolkata"}
            - {name: REST_TIMEOUT_MS, value: "8000"}
          volumeMounts:
            - {name: mcp-secret, mountPath: /secrets/mcp, readOnly: true}
            - {name: woo-secret, mountPath: /secrets/woo, readOnly: true}
      volumes:
        - name: mcp-secret
          secret: {secretName: woo-mcp-auth, defaultMode: 0440}
        - name: woo-secret
          secret: {secretName: store-adapter, defaultMode: 0440}
