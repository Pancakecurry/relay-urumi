# Source: relay-platform/templates/core.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: relay-postgres}
spec:
  serviceName: relay-postgres
  replicas: 1
  selector: {matchLabels: {relay.role: postgres}}
  template:
    metadata: {labels: {relay.role: postgres}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: "postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1"
          args:
            - -c
            - shared_buffers=32MB
            - -c
            - max_connections=40
            - -c
            - log_statement=none
            - -c
            - log_min_error_statement=panic
            - -c
            - log_parameter_max_length_on_error=0
            - -c
            - ssl=on
            - -c
            - ssl_min_protocol_version=TLSv1.3
            - -c
            - ssl_cert_file=/run/tls/tls.crt
            - -c
            - ssl_key_file=/run/tls/tls.key
            - -c
            - ssl_ca_file=/run/tls/ca.crt
            - -c
            - hba_file=/run/tls-auth/pg_hba.conf
          env:
            - {name: POSTGRES_DB, value: relay}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-db-admin, key: pg-postgres}}
          ports: [{name: pg, containerPort: 5432}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          readinessProbe: {exec: {command: [pg_isready, -U, postgres, -d, relay]}, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -U, postgres, -d, relay]}, initialDelaySeconds: 15, periodSeconds: 10}
          volumeMounts:
            - {name: tls, mountPath: /run/tls, readOnly: true}
            - {name: tls-auth, mountPath: /run/tls-auth, readOnly: true}
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: socket, mountPath: /var/run/postgresql}
      volumes:
