apiVersion: apps/v1
kind: Deployment
metadata: {name: relay-api}
spec:
  replicas: 1
  selector: {matchLabels: {relay.role: api}}
  template:
    metadata: {labels: {relay.role: api}}
    spec:
      serviceAccountName: relay-secret-manager
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: "relay/platform:m6-99a36532c5ab56f3"
          imagePullPolicy: IfNotPresent
          command: [node, "dist/apps/api/src/server.js"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 3001}]
          env:
            - {name: RELAY_DATA_TLS, value: "true"}
            - {name: REQUIRE_UPSTREAM_TLS, value: "true"}
            - {name: RELAY_TLS_DIR, value: /run/tls}
            - {name: OAUTH_ENABLED, value: "true"}
            - {name: PUBLIC_ORIGIN, value: "https://relay.example.invalid"}
            - {name: ALLOWED_UPSTREAM_URLS, value: "http://relay-woocommerce.relay-store-m1.svc.cluster.local:3000/mcp,http://relay-calendar.relay-upstreams.svc.cluster.local:3000/mcp,http://relay-totals.relay-upstreams.svc.cluster.local:3000/mcp"}
            - {name: STORE_DOMAIN, value: "stores.example.invalid"}
            - {name: STORE_URL_SUFFIX, value: ""}
            - {name: STORE_USER_LIMIT, value: "2"}
            - {name: STORE_TIMEOUT_SECONDS, value: "600"}
            - {name: MODEL_ENABLED, value: "false"}
            - {name: STOREFRONT_URL, value: "https://store.example.invalid/shop/"}
          resources: {"limits":{"cpu":"500m","memory":"256Mi"},"requests":{"cpu":"50m","memory":"96Mi"}}
          readinessProbe: {httpGet: {scheme: HTTPS, path: /health/ready, port: http, httpHeaders: [{name: Host, value: localhost}]}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {scheme: HTTPS, path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}, initialDelaySeconds: 5, periodSeconds: 10}
          volumeMounts:
            - {name: secrets, mountPath: /run/platform, readOnly: true}
            - {name: tls, mountPath: /run/tls, readOnly: true}
            - {name: db-app-tls, mountPath: /run/db-tls/app, readOnly: true}
            - {name: db-auth-tls, mountPath: /run/db-tls/auth, readOnly: true}
      volumes:
        - {name: tls, secret: {secretName: relay-api-tls, defaultMode: 0440}}
        - {name: db-app-tls, secret: {secretName: relay-db-app-tls, defaultMode: 0440}}
        - {name: db-auth-tls, secret: {secretName: relay-db-auth-tls, defaultMode: 0440}}
        - {name: secrets, secret: {secretName: platform-api, defaultMode: 0440}}

