---
# Source: hosted-mcp/templates/upstream.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-calendar-private
spec:
  podSelector: {matchLabels: {relay.upstream: relay-calendar}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: relay-platform}}
          podSelector: {matchLabels: {relay.role: gateway}}
      ports: [{protocol: TCP, port: 3000}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]

---
# Source: hosted-mcp/templates/upstream.yaml
apiVersion: v1
kind: Service
metadata:
  name: relay-calendar
spec:
  type: ClusterIP
  selector: {relay.upstream: relay-calendar}
  ports: [{name: http, port: 3000, targetPort: http}]

---
# Source: hosted-mcp/templates/upstream.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-calendar
spec:
  replicas: 1
  selector:
    matchLabels: {relay.upstream: relay-calendar}
  template:
    metadata:
      labels: {relay.upstream: relay-calendar, role: utility}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: "relay/upstreams:m2-67835bb064edf78a"
          imagePullPolicy: IfNotPresent
          command: [node, "dist/apps/calendar-mcp/src/server.js"]
          ports: [{name: http, containerPort: 3000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits:
              cpu: 500m
              memory: 192Mi
            requests:
              cpu: 25m
              memory: 64Mi
          livenessProbe:
            httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http, httpHeaders: [{name: Host, value: localhost}]}
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - {name: MCP_SECRET_FILE, value: /secrets/mcp/token}
            - {name: MCP_SERVICE_HOST, value: relay-calendar}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          volumeMounts:
            - {name: mcp-secret, mountPath: /secrets/mcp, readOnly: true}
      volumes:
        - name: mcp-secret
          secret: {secretName: calendar-mcp-auth, defaultMode: 0440}
